<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placement Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#EDF1F5;--surface:#FFFFFF;--sunk:#F5F7FA;--ink:#172033;--muted:#5A6577;--line:#D5DCE6;
 --accent:#0D7680;--accent-soft:#D8EEF0;--gold:#B87A0A;--gold-soft:#FBF0D9;
 --easy:#1C8457;--med:#A86D10;--hard:#BE3A46;
 --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
 --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
 --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
 --r-lg:14px;--r-sm:8px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1420;--surface:#161F30;--sunk:#111A29;--ink:#E6EBF3;--muted:#98A4B7;--line:#26324A;
 --accent:#46C2CC;--accent-soft:#163B44;--gold:#F0B444;--gold-soft:#3A2E14;--easy:#4FC48D;--med:#E3AB4E;--hard:#F2737D;}}
:root[data-theme="dark"]{
 --bg:#0E1420;--surface:#161F30;--sunk:#111A29;--ink:#E6EBF3;--muted:#98A4B7;--line:#26324A;
 --accent:#46C2CC;--accent-soft:#163B44;--gold:#F0B444;--gold-soft:#3A2E14;--easy:#4FC48D;--med:#E3AB4E;--hard:#F2737D;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
code{font:0.86em var(--mono);background:var(--sunk);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-0.01em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 .75em}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0 8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-0.02em;margin-right:auto;display:flex;align-items:baseline;gap:10px}
.brand small{font:500 .8rem var(--body);color:var(--muted)}
.sync{font-size:.8rem;color:var(--muted);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.on::before{background:var(--easy)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 .85rem var(--body);cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:600 .95rem var(--body);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main{padding:28px 0 80px}
.sectionhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.sectionhead p{color:var(--muted);margin:6px 0 0;max-width:68ch}
.muted{color:var(--muted)}
/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 28px 22px;margin-bottom:22px}
.hero-top{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:end}
.lvlname{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,4.4rem);line-height:.95;letter-spacing:-0.035em}
.lvlsub{color:var(--muted);margin-top:8px}
.xpnum{font-family:var(--display);font-weight:700;font-size:1.4rem;text-align:right}
.xpnum span{display:block;font:500 .85rem var(--body);color:var(--muted)}
.ascent{position:relative;margin:26px 4px 6px;height:46px}
.ascent .rail{position:absolute;left:0;right:0;top:9px;height:4px;background:var(--line);border-radius:4px}
.ascent .fill{position:absolute;left:0;top:9px;height:4px;background:var(--accent);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ascent .stop{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.ascent .stop.done{border-color:var(--accent);background:var(--accent)}
.ascent .stop.cur{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
.ascent .lbl{position:absolute;top:26px;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.ascent .lbl{display:none}.ascent .lbl.show{display:block}}
@media (prefers-reduced-motion:reduce){.ascent .fill{transition:none}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:22px}
.panel h3{margin-bottom:12px}
.panel .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.panel .head h3{margin:0}
/* progress bars */
.pbar{height:6px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.tprog{display:grid;grid-template-columns:minmax(0,1fr) 110px 56px;gap:10px;align-items:center;padding:6px 0;font-size:.92rem;border-bottom:1px dashed var(--line)}
.tprog:last-child{border-bottom:0}
.tprog button{all:unset;cursor:pointer;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tprog button:hover{color:var(--accent)}
.tprog .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:var(--sunk);opacity:.55}
.badge.got{opacity:1;background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.badge .em{font-size:1.5rem;line-height:1}
.badge b{display:block;font-size:.88rem;margin-top:6px}
.badge span{font-size:.75rem;color:var(--muted)}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 98px);z-index:10}
@media (max-width:640px){.toolbar{position:static}}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:600 .86rem var(--body);padding:6px 11px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,50,.12)}
.search{flex:1 1 200px;min-width:160px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:.92rem}
select{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:.9rem}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.88rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.filtersum{font-size:.88rem;color:var(--muted);margin:0 0 14px}
/* topic blocks */
details.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
details.block>summary{list-style:none;cursor:pointer;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) 140px 64px 18px;gap:14px;align-items:center}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary h3{font-size:1.1rem}
details.block>summary .n{text-align:right;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
details.block>summary .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.block[open]>summary .chev{transform:rotate(-135deg)}
details.block>summary .sub{display:block;font-size:.82rem;color:var(--muted);margin-top:3px;font-weight:400;font-family:var(--body)}
@media (max-width:640px){details.block>summary{grid-template-columns:minmax(0,1fr) 54px 14px}details.block>summary .pbar{display:none}}
.blockbody{border-top:1px solid var(--line)}
.learn{padding:14px 20px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:.9rem}
.learn strong{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.learn ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px}
.remember{margin:0;padding:14px 20px 16px 20px;border-top:1px solid var(--line);background:var(--gold-soft);font-size:.93rem}
.remember strong{display:block;font-family:var(--display);font-size:.95rem;margin-bottom:4px;color:var(--ink)}
/* problem rows */
.plist{list-style:none;margin:0;padding:0}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 20px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.solved{background:color-mix(in srgb,var(--easy) 6%,transparent)}
.prow.solved .ptitle{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.ck{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--line);border-radius:6px;margin:2px 0 0;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.ck:hover{border-color:var(--accent)}
.ck:checked{background:var(--easy);border-color:var(--easy)}
.ck:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ptitle{font-weight:600;color:var(--ink);text-decoration:none}
.ptitle:hover{color:var(--accent);text-decoration:underline}
.core{display:inline-block;font-size:.7rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}
.plat{font-size:.7rem;font-weight:600;color:var(--easy);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}
.pmeta{font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.45}
.pmeta .co{color:var(--ink);opacity:.8}
.pright{display:flex;gap:8px;align-items:center}
.diff{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.diff.E{color:var(--easy)}.diff.M{color:var(--med)}.diff.H{color:var(--hard)}
.flag{border:0;background:none;cursor:pointer;font-size:1.05rem;line-height:1;color:var(--line);padding:2px}
.flag[aria-pressed="true"]{color:var(--gold)}
.flag:hover{color:var(--gold)}
.due{font-size:.72rem;font-weight:600;color:var(--gold);white-space:nowrap}
/* company */
.cochips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cochip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font:600 .86rem var(--body);cursor:pointer}
.cochip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cochip small{font-weight:500;opacity:.7;margin-left:4px}
.conote{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:center}
@media (max-width:700px){.conote{grid-template-columns:1fr}}
.conf{display:inline-block;font-size:.75rem;font-weight:600;border-radius:5px;padding:1px 7px;margin-left:8px;background:var(--accent-soft);color:var(--accent);vertical-align:3px}
/* generic cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.card.done{border-color:color-mix(in srgb,var(--easy) 55%,var(--line))}
.card h3{font-size:1.05rem}
.card p{font-size:.92rem;margin:0}
.card .links{font-size:.88rem;display:flex;flex-direction:column;gap:3px;margin-top:auto;padding-top:6px}
.card .kv{font-size:.88rem}
.card .kv b{color:var(--muted);font-weight:600}
.markline{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);cursor:pointer;user-select:none}
.markline input{accent-color:var(--easy);width:17px;height:17px}
.prose{max-width:76ch}
.prose ol.steps{padding-left:1.2em;margin:0}
.prose ol.steps li{margin-bottom:.45em}
.tbl{overflow-x:auto;margin:.4em 0 1em;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:600;color:var(--muted);font-size:.82rem}
tr:last-child td{border-bottom:0}
.fbody{padding:16px 20px 18px}
.fbody .links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;margin-top:10px}
.subnav{margin-bottom:18px}
.qa details{border-bottom:1px solid var(--line);padding:10px 0}
.qa details:last-child{border-bottom:0}
.qa summary{cursor:pointer;font-weight:600}
.qa details p{margin:8px 0 0;color:var(--ink);font-size:.94rem}
.checklist{list-style:none;margin:0;padding:0;columns:2 320px;column-gap:28px}
.checklist li{break-inside:avoid;padding:5px 0}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 16px 20px}
.timeline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline b{display:block;font-family:var(--display)}
.patgroup{margin-bottom:22px}
.patgroup h3{margin-bottom:10px}
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:.9rem}
.pat a{font-weight:600}
.pat.done{border-color:color-mix(in srgb,var(--easy) 55%,var(--line))}
.pat .markline{margin-top:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);font:600 .9rem var(--body);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rlist{list-style:none;padding:0;margin:0}
.rlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.rlist li:last-child{border-bottom:0}
.small{font-size:.82rem}
.goalpick{display:inline-flex;gap:4px}
.goalpick button{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:6px;width:28px;height:26px;cursor:pointer;font:600 .8rem var(--body)}
.goalpick button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:22px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(10,15,25,.5)}
dialog textarea{width:100%;height:180px;font:.8rem var(--mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){.brand small{display:none}.sync{font-size:0}.sync::before{margin:0}.bar{gap:10px}}
.foot{color:var(--muted);font-size:.82rem;margin-top:30px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <div class="bar">
  <div class="brand">Placement Toolkit <small>DSA, system design, CS core</small></div>
  <span class="sync" id="sync">Saved in this browser</span>
  <button class="iconbtn" id="themeBtn" aria-label="Switch colour theme">Theme</button>
 </div>
 <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>
<main><div class="wrap" id="view"></div></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const COMPANIES = {
 G:{n:"Google",c:"Likely",note:"Typically 4–5 coding rounds of 45 min, mostly unseen medium–hard problems. Graphs, DP, trees, and clean follow-up handling matter more than memorized answers. Think aloud, state complexity, test with your own cases."},
 A:{n:"Amazon",c:"Certain",note:"Online assessment (2 coding + work-style survey), then a loop where every round also probes Leadership Principles. Arrays, trees, graphs, heaps, and OOD-flavoured questions. Prepare 2 STAR stories per principle."},
 M:{n:"Microsoft",c:"Likely",note:"Practical data-structure questions: linked lists, trees, strings, matrices. Often a design or 'how would you test this' discussion. Clean code and edge cases weigh heavily."},
 F:{n:"Meta",c:"Likely",note:"Two problems in ~40 minutes, so speed and bug-free first drafts matter. Heavy on arrays, strings, trees, graphs, intervals. Their tagged list repeats a lot, so the frequency list is high-yield."},
 Ap:{n:"Apple",c:"Likely",note:"Team-specific loops. Expect practical coding plus domain depth (OS, concurrency, memory) for systems teams. Less standardized than Google/Meta, so read the job description closely."},
 N:{n:"Nvidia",c:"Likely",note:"C/C++ depth is tested hard: pointers, memory layout, bit manipulation, concurrency, plus OS and computer architecture for systems roles. DSA is usually medium. Do the CS Core > COA and Concurrency sections."},
 D:{n:"AMD",c:"Likely",note:"C/C++, bit manipulation, linked lists, OS, and computer organization (caches, pipelining). Some roles add digital logic. DSA rarely beyond medium."},
 Q:{n:"Qualcomm",c:"Likely",note:"Campus OA often mixes aptitude, C output-prediction and coding. Interviews probe C pointers, bit tricks, OS, embedded concepts, linked lists and strings."},
 S:{n:"Stripe",c:"Likely",note:"Not LeetCode-style. Rounds are practical: build a small system incrementally from a spec (parsers, ledgers, rate limiters), integrate with an API, or fix bugs in an unfamiliar codebase. Practise writing clean, tested, readable code fast. The Design & Simulation topic here is your best proxy."},
 U:{n:"Uber",c:"Likely",note:"Graphs, heaps, intervals and design. Uber India historically includes a machine-coding (working LLD) round. Expect scale-flavoured follow-ups."},
 Ad:{n:"Adobe",c:"Likely",note:"Arrays, strings, DP, trees, and stack problems; campus OA then 2–3 technical rounds with CS fundamentals."},
 B:{n:"Bloomberg",c:"Likely",note:"Arrays, strings, linked lists, design-a-class questions, and C++/language depth. Interviewers like discussing real-world trade-offs."},
 GS:{n:"Goldman Sachs",c:"Likely",note:"HackerRank OA (arrays, strings, math, DP), then CoderPad rounds. Probability/maths puzzles appear for some teams."},
 SF:{n:"Salesforce",c:"Guessing",note:"OA plus DSA mediums, OOP/LLD discussion, DBMS and SQL. Fewer public data points than FAANG, so treat these tags as a broad guide."},

{id:"f-complexity",title:"Complexity analysis",body:`<p>Every answer you give needs a time and space cost. Learn to read the cost off the code: nested loops multiply, halving the input each step is log n, and recursion cost = (number of calls) × (work per call).</p>
<p>The constraint tells you the target complexity. Roughly 10<sup>8</sup> simple operations run in about one second.</p>
<div class="tbl"><table><thead><tr><th>n up to</th><th>Target</th><th>Typical technique</th></tr></thead><tbody>
<tr><td>10–12</td><td>O(n!)</td><td>Permutations, brute force</td></tr>
<tr><td>20–25</td><td>O(2ⁿ)</td><td>Subsets, bitmask DP</td></tr>
<tr><td>100–500</td><td>O(n³)</td><td>Floyd–Warshall, interval DP</td></tr>
<tr><td>5,000</td><td>O(n²)</td><td>2D DP, all pairs</td></tr>
<tr><td>10⁵–10⁶</td><td>O(n log n)</td><td>Sorting, heaps, binary search</td></tr>
<tr><td>10⁷–10⁸</td><td>O(n)</td><td>Two pointers, hashing, prefix sums</td></tr>
<tr><td>10⁹+</td><td>O(log n) or O(1)</td><td>Math, binary search on answer</td></tr></tbody></table></div>
<p>Also know: amortized analysis (dynamic array push is O(1) amortized), the Master theorem for divide and conquer (T(n) = aT(n/b) + f(n)), and that recursion depth counts as space.</p>`,links:[["Big-O cheat sheet","https://www.bigocheatsheet.com/"],["Master theorem explained (Brilliant)","https://brilliant.org/wiki/master-theorem/"],["Time complexity lecture (MIT 6.006)","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"]]},
{id:"f-framework",title:"How to attack any problem in an interview",body:`<ol class="steps">
<li><b>Restate and clarify.</b> Input size, ranges, negatives, duplicates, empty input, sorted or not, what to return on failure.</li>
<li><b>Work two examples by hand,</b> including one edge case. Patterns appear while you do this.</li>
<li><b>Say the brute force and its cost.</b> It proves you understand the problem and gives a baseline.</li>
<li><b>Find the bottleneck</b> in the brute force and ask which structure removes it (hash map for lookups, heap for repeated min, sorting for order, prefix sums for range sums).</li>
<li><b>Agree on the approach</b> with the interviewer before coding.</li>
<li><b>Code cleanly:</b> meaningful names, helper functions, no clever one-liners.</li>
<li><b>Test by dry-running</b> your own example line by line, then the edge cases. Fix bugs out loud.</li>
<li><b>State final complexity</b> and one possible improvement or trade-off.</li></ol>`,links:[["Coding interview cheatsheet (Tech Interview Handbook)","https://www.techinterviewhandbook.org/coding-interview-cheatsheet/"],["How to approach a problem (Tech Interview Handbook)","https://www.techinterviewhandbook.org/coding-interview-techniques/"]]},
{id:"f-signals",title:"Pattern recognition: reading the problem's signals",body:`<div class="tbl"><table><thead><tr><th>If the problem says…</th><th>Reach for…</th></tr></thead><tbody>
<tr><td>Sorted array, pair or triplet with a target</td><td>Two pointers or binary search</td></tr>
<tr><td>Contiguous subarray / substring with a condition</td><td>Sliding window, or prefix sum + hash map if values can be negative</td></tr>
<tr><td>Top K, K-th largest, most frequent</td><td>Heap of size K, or quickselect</td></tr>
<tr><td>Next greater / smaller, spans, histograms</td><td>Monotonic stack</td></tr>
<tr><td>Minimize the maximum, smallest value that works</td><td>Binary search on the answer</td></tr>
<tr><td>All combinations, permutations, subsets</td><td>Backtracking</td></tr>
<tr><td>Count ways, min/max cost, overlapping choices</td><td>Dynamic programming</td></tr>
<tr><td>Shortest steps, unweighted grid</td><td>BFS</td></tr>
<tr><td>Weighted shortest path</td><td>Dijkstra</td></tr>
<tr><td>Dependencies, ordering, prerequisites</td><td>Topological sort</td></tr>
<tr><td>Groups, connectivity, merging sets</td><td>Union-Find</td></tr>
<tr><td>Prefixes, autocomplete, word dictionary</td><td>Trie</td></tr>
<tr><td>Overlapping ranges, meetings</td><td>Sort by start + merge, or sweep line</td></tr>
<tr><td>Linked list cycle or middle</td><td>Fast and slow pointers</td></tr>
<tr><td>Values in range 1..n, find missing/duplicate in O(1) space</td><td>Index marking / cyclic sort</td></tr>
<tr><td>Range sums with updates</td><td>Fenwick or segment tree</td></tr></tbody></table></div>`,links:[["LeetCode Patterns (Sean Prashad)","https://seanprashad.com/leetcode-patterns/"],["Algorithms study cheatsheet (Tech Interview Handbook)","https://www.techinterviewhandbook.org/algorithms/study-cheatsheet/"]]},
{id:"f-paradigms",title:"Algorithm design paradigms",body:`<p><b>Brute force</b> enumerates everything; always your starting point. <b>Divide and conquer</b> splits into independent halves and combines (merge sort, quickselect, closest pair). <b>Greedy</b> commits to the locally best choice; correct only when an exchange argument holds. <b>Dynamic programming</b> is divide and conquer where subproblems overlap, so you cache them; it needs optimal substructure. <b>Backtracking</b> is DFS over a decision tree with pruning. <b>Decrease and conquer</b> shrinks by a constant (binary search). <b>Transform and conquer</b> changes the representation first (sort, then scan; build a graph from words; coordinate-compress values).</p>
<p>A useful habit: for each solved problem, write one line saying which paradigm it used and why the others fail.</p>`,links:[["Algorithms by Jeff Erickson (free textbook)","https://jeffe.cs.illinois.edu/teaching/algorithms/"],["MIT 6.006 Introduction to Algorithms","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"]]},
{id:"f-recursion",title:"Recursion mental model",body:`<p>Trust the function: assume the recursive call already works for smaller input, and only write how to combine its result. Every recursive function needs a base case that stops it, a smaller subproblem, and a combine step.</p>
<p>Draw the recursion tree to get complexity: total cost = sum of work across all nodes. Branching factor b and depth d gives roughly b<sup>d</sup> calls without memoization. If the same arguments repeat in that tree, memoize — that is DP.</p>`,links:[["Recursion (Striver A2Z, step 1.4)","https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"],["Recursion visualiser","https://recursion.vercel.app/"]]},
{id:"f-cpp",title:"C++ STL toolkit",body:`<div class="tbl"><table><thead><tr><th>Need</th><th>Use</th><th>Cost</th></tr></thead><tbody>
<tr><td>Dynamic array</td><td><code>vector&lt;int&gt;</code></td><td>push_back O(1)*</td></tr>
<tr><td>Hash map / set</td><td><code>unordered_map</code>, <code>unordered_set</code></td><td>O(1) avg</td></tr>
<tr><td>Ordered map / set</td><td><code>map</code>, <code>set</code>, <code>multiset</code></td><td>O(log n)</td></tr>
<tr><td>Max-heap</td><td><code>priority_queue&lt;int&gt;</code></td><td>O(log n)</td></tr>
<tr><td>Min-heap</td><td><code>priority_queue&lt;int, vector&lt;int&gt;, greater&lt;int&gt;&gt;</code></td><td>O(log n)</td></tr>
<tr><td>Deque / stack / queue</td><td><code>deque</code>, <code>stack</code>, <code>queue</code></td><td>O(1)</td></tr>
<tr><td>First ≥ x / first &gt; x</td><td><code>lower_bound</code>, <code>upper_bound</code></td><td>O(log n)</td></tr>
<tr><td>Sort with custom order</td><td><code>sort(v.begin(), v.end(), [](auto&amp;a, auto&amp;b){return a[1]&lt;b[1];})</code></td><td>O(n log n)</td></tr></tbody></table></div>
<p>Also: <code>pair</code>, <code>tuple</code>, structured bindings, <code>accumulate</code>, <code>__builtin_popcount</code>, <code>iota</code>, <code>next_permutation</code>, <code>nth_element</code>. Watch for <code>int</code> overflow — use <code>long long</code>. <code>unordered_map</code> can be attacked with anti-hash tests in contests; <code>map</code> is safe.</p>`,links:[["cppreference: containers","https://en.cppreference.com/w/cpp/container"],["cppreference: algorithms library","https://en.cppreference.com/w/cpp/algorithm"],["C++ STL for competitive programming (USACO Guide)","https://usaco.guide/bronze/intro-ds"]]},
{id:"f-java",title:"Java Collections toolkit",body:`<div class="tbl"><table><thead><tr><th>Need</th><th>Use</th><th>Cost</th></tr></thead><tbody>
<tr><td>Dynamic array</td><td><code>ArrayList&lt;Integer&gt;</code></td><td>add O(1)*</td></tr>
<tr><td>Hash map / set</td><td><code>HashMap</code>, <code>HashSet</code></td><td>O(1) avg</td></tr>
<tr><td>Insertion-ordered map</td><td><code>LinkedHashMap</code> (LRU via <code>removeEldestEntry</code>)</td><td>O(1)</td></tr>
<tr><td>Ordered map / set</td><td><code>TreeMap</code>, <code>TreeSet</code> (floorKey, ceilingKey)</td><td>O(log n)</td></tr>
<tr><td>Heap</td><td><code>PriorityQueue</code> (min by default; <code>(a,b)-&gt;b-a</code> for max)</td><td>O(log n)</td></tr>
<tr><td>Stack / queue / deque</td><td><code>ArrayDeque</code> (prefer over <code>Stack</code>)</td><td>O(1)</td></tr>
<tr><td>String building</td><td><code>StringBuilder</code></td><td>append O(1)*</td></tr></tbody></table></div>
<p>Also: <code>Arrays.sort</code> (dual-pivot quicksort on primitives, merge sort on objects), <code>Collections.sort</code>, <code>Arrays.fill</code>, <code>map.getOrDefault</code>, <code>map.merge(k, 1, Integer::sum)</code>, <code>computeIfAbsent(k, x -&gt; new ArrayList&lt;&gt;())</code>. Compare boxed <code>Integer</code> values with <code>.equals</code>, never <code>==</code>.</p>`,links:[["java.util package docs","https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/package-summary.html"],["Java Collections tutorial (Baeldung)","https://www.baeldung.com/java-collections"]]},
{id:"f-python",title:"Python toolkit",body:`<div class="tbl"><table><thead><tr><th>Need</th><th>Use</th><th>Cost</th></tr></thead><tbody>
<tr><td>Hash map with default / counts</td><td><code>defaultdict(list)</code>, <code>Counter</code></td><td>O(1) avg</td></tr>
<tr><td>Deque, queue for BFS</td><td><code>collections.deque</code></td><td>O(1) both ends</td></tr>
<tr><td>Min-heap</td><td><code>heapq.heappush / heappop</code> (negate for max)</td><td>O(log n)</td></tr>
<tr><td>Binary search</td><td><code>bisect_left</code>, <code>bisect_right</code></td><td>O(log n)</td></tr>
<tr><td>Memoization</td><td><code>@functools.cache</code></td><td>—</td></tr>
<tr><td>Sorted container</td><td><code>sortedcontainers.SortedList</code> (on LeetCode)</td><td>O(log n)</td></tr>
<tr><td>Combinatorics</td><td><code>itertools.permutations / combinations / product / accumulate</code></td><td>—</td></tr></tbody></table></div>
<p>Pitfalls: <code>[[0]*m]*n</code> shares rows (use a list comprehension), default recursion limit is 1000 (<code>sys.setrecursionlimit</code>), and <code>list.pop(0)</code> is O(n).</p>`,links:[["collections module","https://docs.python.org/3/library/collections.html"],["heapq module","https://docs.python.org/3/library/heapq.html"],["bisect module","https://docs.python.org/3/library/bisect.html"]]},
{id:"f-math",title:"Math refresher",body:`<p>Modular arithmetic: (a + b) mod m and (a · b) mod m distribute; division needs the modular inverse (Fermat: a<sup>m−2</sup> mod m when m is prime). Use 10<sup>9</sup>+7. GCD by Euclid, LCM = a / gcd · b. Sieve of Eratosthenes for primes up to n. nCr via Pascal's triangle or factorials + inverses. Sum 1..n = n(n+1)/2. Number of subsets = 2<sup>n</sup>. Basic probability and expected value show up at Goldman Sachs and quant-flavoured teams.</p>`,links:[["Binary exponentiation","https://cp-algorithms.com/algebra/binary-exp.html"],["Modular inverse","https://cp-algorithms.com/algebra/module-inverse.html"],["Binomial coefficients","https://cp-algorithms.com/combinatorics/binomial-coefficients.html"]]},
{id:"f-edge",title:"Edge-case checklist",body:`<p>Before you say 'done', run through: empty input; one element; all equal; already sorted and reverse sorted; negatives and zero; integer overflow (sums, products, mid = (lo + hi) / 2); duplicates; disconnected graph; cycles; very deep recursion (stack overflow on 10<sup>5</sup> nodes); off-by-one at both ends of every loop and window; mutating a collection while iterating it.</p>`,links:[["Common mistakes (Tech Interview Handbook)","https://www.techinterviewhandbook.org/coding-interview-techniques/"]]},
{id:"f-sorting",title:"Sorting & searching internals",body:`<p>Know how and why: merge sort (stable, O(n log n), O(n) space, good for linked lists and inversion counting), quicksort (average O(n log n), worst O(n²), in-place, random pivot), heap sort (O(n log n), in-place, not stable), counting/radix sort (O(n + k) for small ranges), and quickselect for K-th element in average O(n). Interviewers at Microsoft, Qualcomm and Oracle still ask you to implement one by hand.</p>`,links:[["Sorting visualised","https://visualgo.net/en/sorting"],["Quickselect / order statistics","https://cp-algorithms.com/sequences/k-th.html"]]}
];
const SD_FRAMEWORK = [
["Functional requirements","List the 3–5 features that matter. Ask who the users are and what they do. Write them down; everything else is out of scope unless the interviewer adds it."],
["Non-functional requirements","Scale (DAU, read/write ratio), latency targets, availability vs consistency, durability, and any regional or regulatory constraints. These choices drive the whole design."],
["Back-of-envelope estimates","QPS (average and peak), storage per year, bandwidth, memory for the hot set. Only estimate what changes a decision."],

["High-level design","Draw client → load balancer → services → data stores. Walk one request end to end for each functional requirement. Keep it simple first."],
["Deep dives","Pick the 2–3 hardest parts (hot keys, fan-out, consistency, real-time delivery) and go deep with trade-offs. This is where levels are decided."],
["Bottlenecks & wrap-up","Single points of failure, scaling each tier, monitoring, failure modes, and what you would build next."]
];

const SD_ESTIMATES = "1 day ≈ 86,400 s ≈ 10⁵ s. 1 million requests/day ≈ 12 QPS; 100 M/day ≈ 1,200 QPS. Peak ≈ 2–3× average. 1 billion records × 1 KB = 1 TB. A single well-tuned relational node handles roughly a few thousand writes/s and tens of thousands of simple reads/s; one Redis node roughly 100k ops/s; one Kafka partition tens of MB/s. These are order-of-magnitude anchors, not benchmarks.";
const SD_CONCEPTS = [
{g:"Networking & APIs",items:[
["sd-dns","DNS, CDN & the request path","What happens from typing a URL to seeing a page: DNS resolution, TCP/TLS handshakes, CDN edge caching for static and cacheable dynamic content, then origin.",[["How DNS works (Cloudflare)","https://www.cloudflare.com/learning/dns/what-is-dns/"],["What is a CDN (Cloudflare)","https://www.cloudflare.com/learning/cdn/what-is-a-cdn/"]]],
["sd-api","REST, gRPC, GraphQL","REST: resource URLs, HTTP verbs, cacheable, the default. gRPC: binary protobuf over HTTP/2, fast service-to-service. GraphQL: client picks fields, helps mobile over-fetching, harder to cache. Know pagination (cursor vs offset) and versioning.",[["API design guide (Google Cloud)","https://cloud.google.com/apis/design"],["REST vs gRPC vs GraphQL (ByteByteGo repo)","https://github.com/ByteByteGoHq/system-design-101"]]],
["sd-realtime","Real-time updates: polling, long polling, SSE, WebSockets","Short polling is simple and wasteful. Long polling holds the request until data arrives. Server-Sent Events push one-way over HTTP. WebSockets are full-duplex for chat, games and collaboration; they need sticky routing and a pub/sub layer to fan out across servers.",[["High Performance Browser Networking (free book)","https://hpbn.co/"]]],
["sd-lb","Load balancers, reverse proxies, API gateways","L4 balances TCP connections; L7 routes on HTTP paths and headers. Algorithms: round robin, least connections, consistent hashing for stickiness. Gateways add auth, rate limiting, request shaping. Remove single points of failure with active-passive pairs.",[["Load balancing (NGINX)","https://www.nginx.com/resources/glossary/load-balancing/"],["Introduction to modern network load balancing (Envoy)","https://blog.envoyproxy.io/introduction-to-modern-network-load-balancing-and-proxying-a57f6ff80236"]]]]},
{g:"Data storage",items:[
["sd-sqlnosql","SQL vs NoSQL","Relational: schemas, joins, ACID transactions — the safe default. Key-value (Redis, DynamoDB) for simple lookups at scale; wide-column (Cassandra) for write-heavy time series; document (MongoDB) for flexible nested data; graph DBs for relationship traversals. Choose by access pattern, not hype.",[["Designing Data-Intensive Applications","https://dataintensive.net/"],["SQL or NoSQL (system-design-primer)","https://github.com/donnemartin/system-design-primer#sql-or-nosql"]]],
["sd-index","Indexes: B-trees vs LSM trees","B-trees update in place, give fast reads and range scans (Postgres, MySQL). LSM trees append to a log and compact sorted files later, giving fast writes (Cassandra, RocksDB) at the cost of read and compaction amplification. Composite index column order matters.",[["Use The Index, Luke","https://use-the-index-luke.com/"]]],
["sd-repl","Replication","Leader–follower: writes to one leader, reads scale on followers, beware replication lag (read-your-writes). Multi-leader: multi-region writes, conflict resolution needed. Leaderless (Dynamo-style): quorum reads/writes with R + W > N.",[["Replication chapter summary (DDIA)","https://dataintensive.net/"],["Amazon Dynamo paper","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"]]],
["sd-shard","Partitioning & sharding","Split data by key range (good for scans, risk of hotspots) or hash (even spread, no range scans). Pick a shard key that matches the dominant query. Plan for resharding, cross-shard queries, and hot keys (add a random suffix, cache them).",[["Sharding IDs at Instagram","https://instagram-engineering.com/sharding-ids-at-instagram-1cf5a71e5a5c"]]],
["sd-chash","Consistent hashing","Place nodes and keys on a ring; a key goes to the next node clockwise. Adding or removing a node moves only ~1/N keys. Virtual nodes smooth the distribution. Used in Dynamo, Cassandra, caches and load balancers.",[["Consistent hashing explained (Toptal)","https://www.toptal.com/big-data/consistent-hashing"]]],
["sd-txn","Transactions & isolation levels","ACID. Isolation levels: read committed, repeatable read, snapshot, serializable — and the anomalies each allows (dirty read, non-repeatable read, phantom, write skew). Optimistic (version check) vs pessimistic (SELECT … FOR UPDATE) locking.",[["Consistency models map (Jepsen)","https://jepsen.io/consistency"]]],
["sd-blob","Blob storage & large files","Store files in object storage (S3-like), metadata in a database. Upload directly from the client with pre-signed URLs; chunk large files for resumable uploads and deduplication; serve through a CDN.",[["Amazon S3 overview","https://aws.amazon.com/s3/"]]]]},
{g:"Caching",items:[
["sd-cachepat","Caching patterns","Cache-aside (app reads cache, falls back to DB, fills cache) is the default. Write-through keeps cache fresh at write cost; write-back is fast but risks loss. TTL plus explicit invalidation on writes. Eviction: LRU, LFU.",[["Caching (system-design-primer)","https://github.com/donnemartin/system-design-primer#cache"],["Redis docs","https://redis.io/docs/latest/"]]],
["sd-herd","Cache stampede, hot keys & consistency","When a hot key expires, thousands of requests hit the DB at once. Fixes: request coalescing (single flight), early probabilistic refresh, locks, jittered TTLs, and local in-process caches for the hottest keys.",[["Scaling Memcache at Facebook (paper)","https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf"]]]]},
{g:"Asynchronous processing",items:[
["sd-mq","Message queues vs event logs","Queues (RabbitMQ, SQS) deliver each message to one consumer and delete it. Logs (Kafka) keep an ordered, replayable stream per partition; consumer groups scale reads. Ordering holds only within a partition, so partition by the entity that needs ordering.",[["Kafka design docs","https://kafka.apache.org/documentation/#design"],["Kafka paper","https://notes.stephenholiday.com/Kafka.pdf"]]],
["sd-idem","Delivery guarantees & idempotency","At-most-once, at-least-once, effectively-once. Retries make duplicates inevitable, so make handlers idempotent with idempotency keys or dedup tables. The outbox pattern writes the event in the same DB transaction as the state change.",[["Designing robust APIs with idempotency (Stripe)","https://stripe.com/blog/idempotency"]]],
["sd-saga","Distributed transactions: 2PC and sagas","Two-phase commit gives atomicity across services but blocks if the coordinator dies. Sagas chain local transactions with compensating actions; choreographed (events) or orchestrated (a coordinator). Preferred in microservices.",[["Saga pattern (microservices.io)","https://microservices.io/patterns/data/saga.html"]]]]},
{g:"Distributed systems theory",items:[
["sd-cap","CAP and PACELC","During a network partition you choose consistency or availability. PACELC adds: else, choose latency or consistency. Phrase it per feature: 'balance must be consistent; the like-count can be eventually consistent.'",[["Eventually consistent (Werner Vogels)","https://www.allthingsdistributed.com/2008/12/eventually_consistent.html"]]],
["sd-consensus","Consensus, leader election & quorums","Raft: leader election with terms, log replication to a majority, safety via election restrictions. Used by etcd, Consul, CockroachDB. Quorum math: majority of 2f + 1 nodes tolerates f failures.",[["Raft visualised","http://thesecretlivesofdata.com/raft/"],["Raft site and paper","https://raft.github.io/"]]],
["sd-clocks","Time, clocks & ordering","Wall clocks drift; never order events across machines by timestamp alone. Lamport clocks give a causal total order; vector clocks detect concurrent updates. Spanner uses TrueTime bounds.",[["Time, Clocks, and the Ordering of Events (Lamport)","https://lamport.azurewebsites.net/pubs/time-clocks.pdf"]]],
["sd-locks","Distributed locks & leases","A lock across machines needs a lease with expiry and a fencing token so a paused client cannot write after its lease expires. Redis Redlock is debated; ZooKeeper/etcd are safer.",[["How to do distributed locking (Kleppmann)","https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"]]]]},
{g:"Reliability & operations",items:[
["sd-rate","Rate limiting algorithms","Token bucket (allows bursts), leaky bucket (smooth output), fixed window (simple, edge bursts), sliding window log (exact, memory-heavy), sliding window counter (good balance). Distributed: central Redis with Lua scripts, or local limits with gossip.",[["Scaling your API with rate limiters (Stripe)","https://stripe.com/blog/rate-limiters"]]],
["sd-retry","Timeouts, retries, backoff & circuit breakers","Every remote call needs a timeout. Retry with exponential backoff plus jitter, only for idempotent operations. Circuit breakers stop calling a failing dependency; bulkheads isolate resource pools.",[["Timeouts, retries and backoff with jitter (AWS)","https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"],["Circuit breaker (Martin Fowler)","https://martinfowler.com/bliki/CircuitBreaker.html"]]],
["sd-obs","Observability & deployment","Metrics (RED/USE), structured logs, distributed traces. SLIs, SLOs and error budgets. Blue-green and canary deploys, feature flags, rollbacks.",[["Google SRE book (free)","https://sre.google/sre-book/table-of-contents/"]]]]},
{g:"Scaling patterns",items:[
["sd-fanout","Fan-out on write vs on read","Feeds: push posts into followers' precomputed timelines on write (fast reads, expensive for celebrities) or pull at read time (cheap writes, slow reads). Real systems are hybrid: push for normal users, pull for celebrities.",[["Twitter timeline design (system-design-primer)","https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/twitter/README.md"]]],
["sd-geo","Geospatial indexing","Geohash (string prefixes for nearby cells), quadtrees (adaptive splits for dense areas), Uber's H3 hexagons. Find nearby drivers by querying the current cell plus neighbours.",[["H3: Uber's hexagonal index","https://www.uber.com/blog/h3/"]]],
["sd-prob","Probabilistic data structures","Bloom filters answer 'definitely not present' cheaply (crawlers, cache filters). HyperLogLog counts unique items in KBs. Count-min sketch estimates frequencies for top-K/heavy hitters.",[["Bloom filters by example","https://llimllib.github.io/bloomfilter-tutorial/"],["HyperLogLog in Presto (Meta Engineering)","https://engineering.fb.com/2018/12/13/data-infrastructure/hyperloglog/"]]],
["sd-search","Search & inverted indexes","Map each term to a postings list of documents; rank with TF-IDF/BM25. Elasticsearch shards the index. Typeahead uses a trie or prefix table with precomputed top suggestions.",[["Elasticsearch: what is it","https://www.elastic.co/what-is/elasticsearch"]]],
["sd-ids","Unique ID generation","Auto-increment does not scale across shards. UUIDs are unordered and big. Snowflake-style IDs pack timestamp + machine + sequence into 64 bits, roughly time-sortable.",[["Announcing Snowflake (Twitter)","https://blog.x.com/engineering/en_us/a/2010/announcing-snowflake"]]]]},
{g:"Security",items:[
["sd-auth","Authentication & authorization","Sessions vs JWTs (stateless but hard to revoke). OAuth 2.0 / OpenID Connect for delegated login. RBAC vs ABAC. TLS everywhere; encryption at rest; secrets in a vault; hash passwords with bcrypt/argon2.",[["OAuth 2.0 simplified","https://www.oauth.com/"],["OWASP Top 10","https://owasp.org/www-project-top-ten/"]]]]}
];

["hld-rate","Distributed rate limiter","Limit per user/IP/API key across many gateway nodes with low latency.","Algorithm choice, atomic counters in Redis (Lua), what to do when Redis is down (fail open vs closed), headers like Retry-After.",[["Stripe: rate limiters","https://stripe.com/blog/rate-limiters"]]],
["hld-id","Unique ID generator","Globally unique, roughly time-ordered 64-bit IDs at high throughput.","Snowflake bit layout, clock skew handling, worker ID assignment via ZooKeeper/etcd.",[["Snowflake (Twitter)","https://blog.x.com/engineering/en_us/a/2010/announcing-snowflake"],["Sharding IDs at Instagram","https://instagram-engineering.com/sharding-ids-at-instagram-1cf5a71e5a5c"]]],
["hld-kv","Distributed key-value store","get/put at scale, tunable consistency, survive node failures.","Consistent hashing, replication with quorums, hinted handoff, vector clocks / last-write-wins, gossip membership, Merkle-tree anti-entropy.",[["Amazon Dynamo paper","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"]]],
["hld-cache","Distributed cache","Low-latency reads for hot data across a cluster.","Partitioning, eviction, replication for hot keys, stampede protection, cache consistency with the DB.",[["Scaling Memcache at Facebook","https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf"]]],
["hld-chat","Chat app (WhatsApp / Slack)","1:1 and group messages, online presence, delivery/read receipts, offline delivery.","WebSocket gateways + a routing layer (which server holds this user), message ordering per conversation, storage (Cassandra-style wide rows), push notifications for offline users.",[["Hello Interview: WhatsApp","https://www.hellointerview.com/learn/system-design/problem-breakdowns/whatsapp"],["How Discord stores trillions of messages","https://discord.com/blog/how-discord-stores-trillions-of-messages"],["Real-time messaging at Slack","https://slack.engineering/real-time-messaging/"]]],

["hld-ticket","Ticket booking (Ticketmaster / BookMyShow)","Browse events, hold seats, pay, avoid double booking under huge spikes.","Seat reservation with TTL holds (Redis or DB row locks), virtual waiting queue for hot events, search via Elasticsearch, payment idempotency.",[["Hello Interview: Ticketmaster","https://www.hellointerview.com/learn/system-design/problem-breakdowns/ticketmaster"]]],
["hld-pay","Payment system","Charge cards, never double charge, reconcile with banks.","Idempotency keys, double-entry ledger, state machine per payment, async reconciliation, PSP integration, exactly-once effects via outbox.",[["Stripe: idempotency","https://stripe.com/blog/idempotency"],["Online payments at Stripe (engineering blog)","https://stripe.com/blog/engineering"]]],

["hld-topk","Top-K / trending / leaderboard","Most viewed videos or top players over time windows.","Stream processing with windowed counts, count-min sketch for approximation, Redis sorted sets for leaderboards, precomputed rollups.",[["Hello Interview: top-K","https://www.hellointerview.com/learn/system-design/problem-breakdowns/top-k"]]],

res:[["OSTEP: Operating Systems, Three Easy Pieces (free)","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["Gate Smashers OS playlist","https://www.youtube.com/@GateSmashers"],["Neso Academy OS","https://www.youtube.com/@nesoacademy"],["xv6 teaching OS (MIT 6.1810)","https://pdos.csail.mit.edu/6.1810/"],["The Little Book of Semaphores","https://greenteapress.com/semaphores/LittleBookOfSemaphores.pdf"]],
topics:[["os-proc","Processes vs threads, PCB, context switch"],["os-sched","CPU scheduling: FCFS, SJF, SRTF, priority, round robin, MLFQ"],["os-sync","Race conditions, critical section, mutex, semaphores, monitors"],["os-classic","Producer–consumer, readers–writers, dining philosophers"],["os-dead","Deadlock: four conditions, prevention, avoidance (Banker's), detection"],["os-mem","Paging, page tables, TLB, multi-level paging, segmentation"],["os-vm","Virtual memory, demand paging, page faults, replacement (FIFO, LRU, optimal), thrashing"],["os-fs","File systems: inodes, directories, journaling, disk scheduling"],["os-ipc","IPC: pipes, message queues, shared memory, signals, sockets"],["os-sys","System calls, user vs kernel mode, interrupts, fork/exec, zombie and orphan processes"]],
qa:[["Process vs thread?","A process has its own address space; threads share the process's memory, file descriptors and heap but have their own stack and registers. Thread switches are cheaper; a crashing thread can take down the process."],["What happens on a context switch?","The kernel saves the running task's registers, program counter and state into its PCB/TCB, picks the next task, restores its saved state, and (for a process switch) changes the page-table base, often flushing the TLB."],["Mutex vs semaphore?","A mutex is a lock owned by one thread, released by that thread. A counting semaphore is a counter that permits up to N concurrent holders and can be signalled by any thread, so it also works for ordering."],["Four conditions for deadlock?","Mutual exclusion, hold and wait, no preemption, circular wait. Break any one to prevent deadlock; ordering lock acquisition breaks circular wait."],["What is thrashing?","The system spends more time paging than executing because the working sets of active processes exceed physical memory. Fix by reducing the degree of multiprogramming or adding memory."],["Why does a TLB matter?","Each memory access would otherwise need extra page-table lookups. The TLB caches virtual-to-physical translations, so most accesses translate in one cycle."],["What is a zombie process?","A child that has exited but whose parent has not yet called wait() to read its exit status; its PCB entry lingers. An orphan is a child whose parent died first; init/systemd adopts it."],["Paging vs segmentation?","Paging splits memory into fixed-size pages (no external fragmentation, some internal). Segmentation uses variable-size logical segments (code, stack, heap) and suffers external fragmentation."],["What does fork() return?","0 in the child, the child's PID in the parent, −1 on failure. Copy-on-write means pages are only duplicated when one side writes."],["Spinlock vs blocking lock?","A spinlock busy-waits; good on multicore when the hold time is shorter than a context switch. A blocking lock sleeps the thread; better for longer waits."],["Explain virtual memory in one minute.","Each process sees a private, contiguous address space. The MMU maps virtual pages to physical frames via page tables; pages not in RAM live on disk and are loaded on a page fault. This gives isolation, larger-than-RAM programs, and easy sharing."],["Starvation vs deadlock?","Deadlock: a set of processes wait on each other forever. Starvation: a process waits indefinitely because others keep being preferred; aging fixes it."]]},

res:[["Computer Networking: A Top-Down Approach (Kurose & Ross site)","https://gaia.cs.umass.edu/kurose_ross/index.php"],["High Performance Browser Networking (free)","https://hpbn.co/"],["Beej's Guide to Network Programming","https://beej.us/guide/bgnet/"],["Gate Smashers CN playlist","https://www.youtube.com/@GateSmashers"],["Cloudflare Learning Center","https://www.cloudflare.com/learning/"]],
topics:[["cn-osi","OSI vs TCP/IP layers and what lives where"],["cn-url","What happens when you type a URL"],["cn-tcp","TCP: 3-way handshake, teardown, flow control, congestion control, retransmission"],["cn-udp","UDP and when to choose it (DNS, streaming, QUIC)"],["cn-ip","IP addressing, subnetting, CIDR, NAT, IPv4 vs IPv6"],["cn-route","Routing: distance vector vs link state, BGP basics, ARP"],["cn-http","HTTP/1.1 vs HTTP/2 vs HTTP/3, status codes, methods, cookies, caching headers"],["cn-tls","TLS handshake, certificates, HTTPS"],["cn-dns","DNS resolution, record types, TTLs"],["cn-sock","Sockets programming, ports, WebSockets"]],
qa:[["TCP vs UDP?","TCP is connection-oriented, reliable, ordered, with flow and congestion control. UDP is connectionless and best-effort with tiny overhead. Use UDP when latency beats reliability (voice, games, DNS) or when the app adds its own reliability (QUIC)."],["Explain the 3-way handshake.","Client sends SYN with its initial sequence number; server replies SYN-ACK with its own; client sends ACK. Both sides now agree on sequence numbers. Teardown uses FIN/ACK in each direction (4 steps)."],["What happens when you type a URL?","Browser cache → DNS lookup (browser, OS, resolver, root, TLD, authoritative) → TCP handshake → TLS handshake → HTTP request → server/load balancer/app → response → browser parses HTML, fetches assets, renders."],["Flow control vs congestion control?","Flow control protects the receiver (advertised receive window). Congestion control protects the network (slow start, congestion avoidance, fast retransmit/recovery; CUBIC, BBR)."],["What is NAT?","Network Address Translation maps many private IPs to one public IP by rewriting addresses and ports at the router. It saves IPv4 addresses and blocks unsolicited inbound connections."],["HTTP/2 vs HTTP/3?","HTTP/2 multiplexes streams over one TCP connection with binary framing and header compression but suffers TCP head-of-line blocking. HTTP/3 runs over QUIC (UDP), removing that blocking and speeding up connection setup."],["How does TLS work?","Client and server agree on a cipher suite, the server proves identity with a certificate chain, they perform a key exchange (ECDHE) to derive a shared session key, then encrypt traffic symmetrically."],["What does ARP do?","Maps an IP address to a MAC address on the local network by broadcasting 'who has this IP?' and caching the reply."],["Subnet question: how many hosts in /26?","2^(32−26) = 64 addresses, minus network and broadcast = 62 usable hosts."],["GET vs POST?","GET retrieves, should be safe and idempotent, parameters in the URL, cacheable. POST submits data in the body, not idempotent by default."],["What are cookies vs sessions vs JWT?","Cookies are client-side key-values sent with each request. A session stores state server-side, referenced by a cookie ID. A JWT is a signed token carrying claims, verifiable without server state."]]},

res:[["CMU 15-445 Database Systems (lectures free)","https://15445.courses.cs.cmu.edu/"],["Use The Index, Luke","https://use-the-index-luke.com/"],["LeetCode SQL 50","https://leetcode.com/studyplan/top-sql-50/"],["SQLBolt interactive lessons","https://sqlbolt.com/"],["Gate Smashers DBMS playlist","https://www.youtube.com/@GateSmashers"]],
topics:[["db-er","ER modelling, keys (super, candidate, primary, foreign)"],["db-norm","Normalization: 1NF, 2NF, 3NF, BCNF, functional dependencies"],["db-acid","ACID properties and transactions"],["db-iso","Isolation levels and anomalies"],["db-cc","Concurrency control: 2PL, MVCC, timestamps, deadlocks in DBs"],["db-idx","Indexing: B+ trees, hash indexes, clustered vs non-clustered"],["db-sql","SQL: joins, GROUP BY / HAVING, subqueries, window functions"],["db-rec","Recovery: write-ahead logging, checkpoints"],["db-nosql","NoSQL types and CAP trade-offs"],["db-query","Query processing and optimization basics"]],
qa:[["Explain ACID.","Atomicity: all or nothing. Consistency: constraints hold before and after. Isolation: concurrent transactions behave as if serial (to a chosen level). Durability: committed data survives crashes, via the write-ahead log."],["Why normalize? When denormalize?","Normalization removes redundancy and update anomalies. Denormalize deliberately for read performance when joins become the bottleneck, accepting the cost of keeping copies in sync."],["Clustered vs non-clustered index?","A clustered index defines the physical order of rows (one per table). A non-clustered index is a separate structure pointing to rows; you can have many."],["Why B+ trees for indexes?","High fan-out keeps the tree shallow (few disk reads), all values live in leaves linked for fast range scans, and the tree stays balanced on inserts and deletes."],["DELETE vs TRUNCATE vs DROP?","DELETE removes selected rows, logged per row, can be rolled back. TRUNCATE removes all rows quickly, resets storage. DROP removes the table itself."],["WHERE vs HAVING?","WHERE filters rows before grouping; HAVING filters groups after aggregation."],["Find the second highest salary.","SELECT MAX(salary) FROM Employee WHERE salary < (SELECT MAX(salary) FROM Employee); or DENSE_RANK() OVER (ORDER BY salary DESC) = 2."],["What is MVCC?","Multi-version concurrency control keeps several versions of a row so readers see a consistent snapshot without blocking writers. Postgres and InnoDB use it."],["What are the isolation anomalies?","Dirty read (read uncommitted data), non-repeatable read (row changes between reads), phantom read (new rows appear in a range), and write skew (two transactions each read then write based on stale assumptions)."],["Primary key vs unique key?","Both enforce uniqueness. A primary key cannot be NULL and there is one per table; unique keys allow NULLs (rules vary by DB) and there can be many."],["Explain the types of JOIN.","INNER: matching rows only. LEFT/RIGHT: all rows from one side plus matches. FULL OUTER: all rows from both. CROSS: Cartesian product. SELF: a table joined with itself."]]},

res:[["Computer Systems: A Programmer's Perspective (CS:APP site)","https://csapp.cs.cmu.edu/"],["nand2tetris: build a computer from gates","https://www.nand2tetris.org/"],["What every programmer should know about memory (Drepper)","https://people.freebsd.org/~lstewart/articles/cpumemory.pdf"],["Gate Smashers COA playlist","https://www.youtube.com/@GateSmashers"],["Bit Twiddling Hacks","https://graphics.stanford.edu/~seander/bithacks.html"]],

qa:[["What is cache locality?","Temporal: recently used data is likely reused. Spatial: nearby addresses are likely used soon. Iterate arrays row-major in C to exploit spatial locality."],["Compute average memory access time.","AMAT = hit time + miss rate × miss penalty. E.g. 1 ns + 0.05 × 100 ns = 6 ns."],["What are pipeline hazards?","Structural (resource conflict), data (an instruction needs a result not yet written — fixed by forwarding or stalls), control (branches — fixed by prediction and flushing)."],["What is false sharing?","Two threads write different variables that sit on the same cache line, so the line ping-pongs between cores. Fix with padding or aligning per-thread data to cache-line size."],["Little vs big endian?","Little endian stores the least significant byte at the lowest address (x86, most ARM). Check: int x = 1; *(char*)&x == 1 means little endian."],["What does volatile do in C?","Tells the compiler the value may change outside the program's control (hardware registers, signal handlers), so every access must actually read/write memory. It is not a synchronization primitive."],["Why does struct padding exist?","CPUs access aligned data faster (or require it), so compilers insert padding so each member sits at a multiple of its alignment. Order members largest-to-smallest to reduce size."],["Two's complement of −5 in 8 bits?","5 = 00000101, invert = 11111010, add 1 = 11111011."],["What is DMA?","Direct Memory Access lets a device transfer data to/from memory without the CPU copying each byte; the CPU is interrupted only when the transfer completes."],["CPU vs GPU?","CPUs have few powerful cores with big caches and branch prediction, optimized for latency. GPUs have thousands of simple cores running the same instruction across many threads (SIMT), optimized for throughput on data-parallel work."],["Explain the MESI protocol.","Each cache line is Modified, Exclusive, Shared or Invalid. Writes require exclusive ownership, invalidating other copies, which keeps caches coherent across cores."],["Difference between malloc and calloc?","malloc(n) allocates n bytes uninitialized; calloc(count, size) allocates and zero-fills, and checks multiplication overflow."]]},

qa:[["Overloading vs overriding?","Overloading: same name, different parameters, resolved at compile time. Overriding: subclass redefines a base virtual method with the same signature, resolved at runtime."],["How do virtual functions work?","Each class with virtual methods has a vtable of function pointers; each object stores a pointer to its class's vtable, and calls go through it at runtime."],["Abstract class vs interface?","An abstract class can hold state and implemented methods; a class can extend only one (in Java). An interface defines a contract; a class can implement many."],["What is the diamond problem?","When a class inherits from two classes that share a base, it gets two copies of the base. C++ solves it with virtual inheritance; Java avoids it by disallowing multiple class inheritance."],["Shallow vs deep copy?","Shallow copy copies pointers, so both objects share the pointed-to data. Deep copy duplicates the data. Needed when a class owns heap memory."],["Why make a destructor virtual?","So deleting a derived object through a base pointer calls the derived destructor too; otherwise resources leak."],["Composition vs inheritance?","Inheritance is 'is-a' and couples tightly to the parent. Composition is 'has-a' and lets you swap parts at runtime. Prefer composition unless substitutability is genuinely needed."]]}

 else if(ui.mode==="diff"){[["E","Easy","Warm-ups and building blocks. Aim for under 15 minutes each."],["M","Medium","The bulk of real interviews. Aim for 25–30 minutes with clean code."],["H","Hard","Separates top offers. Aim for a working approach in 40 minutes."]].forEach(([d,n,s])=>{const l=all.filter(p=>p.d===d);if(l.length)out+=block("d:"+d,n,s,l);});}
 else{const c=COMPANIES[ui.co];const cl=PROBS.filter(p=>p.cos.includes(ui.co));const l=all.filter(p=>p.cos.includes(ui.co));
  out+=`<div class="cochips" role="group" aria-label="Choose company">${Object.keys(COMPANIES).map(k=>`<button class="cochip" data-co="${k}" aria-pressed="${ui.co===k}">${COMPANIES[k].n}<small>${PROBS.filter(p=>p.cos.includes(k)).length}</small></button>`).join("")}</div>
  <div class="panel conote"><div><h3>${c.n} <span class="conf" title="How sure this description is">${c.c}</span></h3><p style="margin-top:8px">${esc(c.note)}</p><p class="small muted">Tags here come from public reports and well-known lists, not LeetCode Premium. For 30/60/90-day frequency, check the ${link("free company-wise lists","https://github.com/liquidslr/leetcode-company-wise-problems")} before your interview.</p></div>
  <div><div class="small muted">${countSolved(cl)} of ${cl.length} solved</div>${bar(countSolved(cl),cl.length)}</div></div>`;
  TOPICS.forEach(t=>{const tl=l.filter(p=>p.topic===t.id);if(tl.length){if(!open.has("c:"+ui.co+":"+t.id)&&!open.has("c-init:"+ui.co)){}out+=block("c:"+ui.co+":"+t.id,esc(t.name),"",tl);}});}
 return out;}
function markline(id,label){return `<label class="markline"><input type="checkbox" data-chk="${id}" ${S.chk[id]?"checked":""}> ${label||"Done"}</label>`;}
function vFound(){const d=FOUNDATIONS.filter(f=>S.chk[f.id]).length;
 return `<div class="sectionhead"><div><h2>Foundations</h2><p>Do these before the DSA sheet. They are the toolkit every topic assumes: reading constraints, the interview method, your language's library, and the signals that point to a pattern.</p></div><div style="min-width:200px"><div class="small muted">${d} of ${FOUNDATIONS.length} read</div>${bar(d,FOUNDATIONS.length)}</div></div>
 ${FOUNDATIONS.map(f=>`<details class="block" data-key="f:${f.id}" ${open.has("f:"+f.id)?"open":""}><summary><div><h3>${f.title}</h3></div><span></span><span class="n">${S.chk[f.id]?"Read":""}</span><span class="chev" aria-hidden="true"></span></summary><div class="blockbody fbody prose">${f.body}<div class="links">${f.links.map(([a,b])=>link(a,b)).join("")}</div><div style="margin-top:12px">${markline(f.id,"Mark as read")}</div></div></details>`).join("")}`;}
function vSD(){const subs=[["framework","Interview framework"],["concepts","HLD concepts"],["cases","HLD case studies"],["lld","Low-level design"],["papers","Papers"],["resources","Resources"]];
 let out=`<div class="sectionhead"><div><h2>System design</h2><p>A map of the best free material, ordered for interview prep. Read a concept, then apply it in a case study by drawing the design yourself before opening the reference.</p></div></div>
 <div class="seg subnav" role="group" aria-label="System design sections">${subs.map(([k,n])=>`<button data-sd="${k}" aria-pressed="${ui.sd===k}">${n}</button>`).join("")}</div>`;
 if(ui.sd==="framework"){out+=`<div class="grid2"><div class="panel prose"><h3>The 45-minute flow</h3><ol class="timeline" style="margin-top:12px">${SD_FRAMEWORK.map(([a,b])=>`<li><b>${a}</b><span class="small">${b}</span></li>`).join("")}</ol></div>
 <div><div class="panel"><h3>Latency numbers</h3><div class="tbl"><table><tbody>${SD_NUMBERS.map(([a,b])=>`<tr><td>${a}</td><td style="white-space:nowrap">${b}</td></tr>`).join("")}</tbody></table></div><p class="small muted">Based on Jeff Dean's well-known list, adjusted for modern SSDs and an India–US round trip.</p></div>
 <div class="panel"><h3>Estimation anchors</h3><p class="small">${SD_ESTIMATES}</p></div></div></div>`;}
 else if(ui.sd==="concepts"){SD_CONCEPTS.forEach(g=>{const d=g.items.filter(i=>S.chk[i[0]]).length;out+=`<div class="patgroup"><div class="sectionhead" style="margin-bottom:10px"><h3>${g.g}</h3><span class="small muted">${d}/${g.items.length}</span></div><div class="cards">${g.items.map(([id,t,d2,ls])=>`<div class="card ${S.chk[id]?"done":""}"><h3>${t}</h3><p>${d2}</p><div class="links">${ls.map(([a,b])=>link(a,b)).join("")}</div>${markline(id,"Understood")}</div>`).join("")}</div></div>`;});}
 else if(ui.sd==="cases"){const d=SD_CASES.filter(c=>S.chk[c[0]]).length;out+=`<p class="filtersum">${d} of ${SD_CASES.length} designed. Try each for 45 minutes on paper first, then compare.</p><div class="cards">${SD_CASES.map(([id,t,req,crux,ls])=>`<div class="card ${S.chk[id]?"done":""}"><h3>${t}</h3><p class="kv"><b>Scope:</b> ${req}</p><p class="kv"><b>Where it gets hard:</b> ${crux}</p><div class="links">${ls.map(([a,b])=>link(a,b)).join("")}</div>${markline(id,"Designed it myself")}</div>`).join("")}</div>`;}
 else if(ui.sd==="lld"){out+=`<div class="patgroup"><h3>Principles</h3><div class="cards">${LLD_PRINCIPLES.map(([id,t,dd,ls])=>`<div class="card ${S.chk[id]?"done":""}"><h3>${t}</h3><p>${dd}</p><div class="links">${ls.map(([a,b])=>link(a,b)).join("")}</div>${markline(id,"Understood")}</div>`).join("")}</div></div>`;
  LLD_PATTERNS.forEach(([g,ps])=>{out+=`<div class="patgroup"><h3>${g} patterns</h3><div class="pats">${ps.map(([slug,n,w])=>`<div class="pat ${S.chk["pat-"+slug]?"done":""}">${link(n,"https://refactoring.guru/design-patterns/"+slug)}<div class="small muted">${w}</div>${markline("pat-"+slug,"Can code it")}</div>`).join("")}</div></div>`;});
  out+=`<div class="patgroup"><div class="sectionhead" style="margin-bottom:10px"><div><h3>Machine-coding case studies</h3><p class="small">Write each as runnable code in 90 minutes. Reference solutions: ${link("awesome-low-level-design","https://github.com/ashishps1/awesome-low-level-design")} and ${link("Grokking OOD notes","https://github.com/tssovi/grokking-the-object-oriented-design-interview")}.</p></div></div><div class="cards">${LLD_CASES.map(([id,t,f,pt])=>`<div class="card ${S.chk[id]?"done":""}"><h3>${t}</h3><p>${f}</p><p class="kv"><b>Patterns:</b> ${pt}</p>${markline(id,"Coded it end to end")}</div>`).join("")}</div></div>`;}
 else if(ui.sd==="papers"){out+=`<div class="panel"><p class="small muted">Reading even three of these puts you ahead of most candidates in senior or infra-leaning loops.</p><ul class="rlist">${SD_PAPERS.map(([id,t,u])=>`<li>${link(t,u)}${markline(id,"Read")}</li>`).join("")}</ul></div>`;}
 else{SD_RESOURCES.forEach(([g,ls])=>{out+=`<div class="patgroup"><h3>${g}</h3><div class="pats">${ls.map(([n,u,w])=>`<div class="pat">${link(n,u)}<div class="small muted">${w}</div></div>`).join("")}</div></div>`;});}
 return out;}
function vCore(){const s=CORE.find(c=>c.id===ui.core)||CORE[0];const d=s.topics.filter(t=>S.chk[t[0]]).length;
 return `<div class="sectionhead"><div><h2>CS core</h2><p>Theory rounds decide close calls. Each subject has the best free sources, a topic checklist, and the questions interviewers ask most, with crisp answers.</p></div></div>
 <div class="seg subnav" role="group" aria-label="Subjects">${CORE.map(c=>`<button data-core="${c.id}" aria-pressed="${ui.core===c.id}">${c.name}</button>`).join("")}</div>
 <div class="grid2"><div><div class="panel"><div class="head"><h3>${s.name}</h3><span class="small muted">${d}/${s.topics.length}</span></div><p class="small muted">${s.blurb}</p>${bar(d,s.topics.length)}<ul class="checklist" style="margin-top:14px">${s.topics.map(([id,t])=>`<li>${markline(id,t)}</li>`).join("")}</ul></div>
 <div class="panel qa"><h3>Most-asked questions</h3>${s.qa.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</div></div>
 <div><div class="panel"><h3>Study from</h3><ul class="rlist">${s.res.map(([a,b])=>`<li>${link(a,b)}</li>`).join("")}</ul></div></div></div>`;}
function vPlay(){return `<div class="sectionhead"><div><h2>Interview playbook</h2><p>The order to do things in, and everything outside DSA and design that decides offers.</p></div></div>
 <div class="grid2"><div class="panel"><h3>A 24-week plan</h3><p class="small muted">About 1–2 new problems a day plus reviews. Shift it to end two weeks before your first on-campus test.</p><ol class="timeline" style="margin-top:12px">${ROADMAP.map(([a,b])=>`<li><b>${a}</b><span class="small">${b}</span></li>`).join("")}</ol></div>
 <div>${PLAYBOOK.map(p=>`<div class="panel ${S.chk[p.id]?"":""}"><h3>${p.t}</h3><div class="small">${p.body}</div><div class="row small" style="gap:6px 16px">${p.links.map(([a,b])=>link(a,b)).join("")}</div><div style="margin-top:10px">${markline(p.id,"Done")}</div></div>`).join("")}</div></div>`;}
/* ---------- render ---------- */
function render(){const y=window.scrollY;renderTabs();const v=$("#view");
 v.innerHTML=({home:vHome,found:vFound,dsa:vDSA,sd:vSD,core:vCore,play:vPlay}[ui.tab]||vHome)()+`<p class="foot">Links open in a new tab. Problem links point to LeetCode unless marked GFG. Company descriptions carry a confidence tag; frequency changes every season.</p>`;
 if(ui.tab==="dsa"){$("#fd").value=ui.diff;$("#fs").value=ui.status;}
 window.scrollTo(0,y);}
/* ---------- events ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-mode],[data-co],[data-sd],[data-core],[data-flag],[data-review],[data-jump],[data-goal],[data-act]");if(!t)return;
 if(t.dataset.tab){go(t.dataset.tab);}
 else if(t.dataset.mode){ui.mode=t.dataset.mode;saveUI();render();}
 else if(t.dataset.co){ui.co=t.dataset.co;saveUI();render();}
 else if(t.dataset.sd){ui.sd=t.dataset.sd;saveUI();render();}
 else if(t.dataset.core){ui.core=t.dataset.core;saveUI();render();}
 else if(t.dataset.flag){const id=t.dataset.flag;if(S.flag[id])delete S.flag[id];else S.flag[id]=1;persist();render();}
 else if(t.dataset.review){reviewDone(t.dataset.review);}
 else if(t.dataset.goal){S.goal=+t.dataset.goal;persist();render();}
 else if(t.dataset.jump){open.add("t:"+t.dataset.jump);ui.mode="topic";go("dsa");setTimeout(()=>{const el=document.querySelector(`[data-key="t:${t.dataset.jump}"]`);if(el)el.scrollIntoView({behavior:"smooth"});},30);}
 else if(t.dataset.act==="export")openDlg("export");else if(t.dataset.act==="import")openDlg("import");});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.solve)toggleSolve(t.dataset.solve,t.checked);
 else if(t.dataset.chk)toggleChk(t.dataset.chk,t.checked);
 else if(t.id==="fd"){ui.diff=t.value;saveUI();render();}
 else if(t.id==="fs"){ui.status=t.value;saveUI();render();}
 else if(t.id==="fc"){ui.coreOnly=t.checked;saveUI();render();}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.tagName==="DETAILS"&&d.dataset.key){if(d.open)open.add(d.dataset.key);else open.delete(d.dataset.key);}},true);
let qT;document.addEventListener("input",e=>{if(e.target.id==="q"){clearTimeout(qT);qT=setTimeout(()=>{ui.q=e.target.value;render();const q=$("#q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},180);}});
/* ---------- backup dialog ---------- */
function openDlg(kind){const d=$("#dlg");
 if(kind==="export"){d.innerHTML=`<h3>Back up progress</h3><p class="small muted">Copy this text and keep it somewhere safe (a note, an email to yourself).</p><textarea id="bk" readonly>${esc(JSON.stringify(S))}</textarea><div class="row"><button class="btn" id="cp">Copy</button><button class="btn ghost" id="cl">Close</button></div>`;
  d.showModal();$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText($("#bk").value);toast("Copied");}catch(e){$("#bk").select();toast("Press Ctrl+C to copy");}};}
 else{d.innerHTML=`<h3>Restore from backup</h3><p class="small muted">Paste a backup. This replaces your current progress.</p><textarea id="bk" placeholder="Paste backup text here"></textarea><div class="row"><button class="btn" id="rs">Restore</button><button class="btn ghost" id="cl">Cancel</button></div>`;
  d.showModal();$("#rs").onclick=()=>{try{const o=JSON.parse($("#bk").value);if(!o||typeof o.solved!=="object")throw 0;S=Object.assign(blank(),o);persist();d.close();render();toast("Progress restored");}catch(e){toast("That text isn't a valid backup");}};}
 $("#cl").onclick=()=>d.close();}
/* ---------- theme ---------- */
const THEMES=["auto","light","dark"];let theme="auto";try{theme=localStorage.getItem(KEY+"-theme")||"auto";}catch(e){}
function applyTheme(){if(theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",theme);$("#themeBtn").textContent={auto:"Auto theme",light:"Light",dark:"Dark"}[theme];}
$("#themeBtn").onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{localStorage.setItem(KEY+"-theme",theme);}catch(e){}applyTheme();};
applyTheme();render();
/* ---------- account sync ---------- */
(async function(){try{if(!window.claude||!window.claude.use)return;const user=await window.claude.use("user");const d=await window.claude.use("db");if(!user||!d)return;const uid=await user.id();if(!uid)return;
 db=d;const ref=db.doc("data/users/"+uid+"/progress");const snap=await ref.get();
 if(snap.exists){const r=snap.data();if(r&&(r.u||0)>(S.u||0)){S=Object.assign(blank(),JSON.parse(JSON.stringify(r)));try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();}}
 docRef=ref;if(!snap.exists||(snap.data().u||0)<(S.u||0)){await ref.set(JSON.parse(JSON.stringify(S)));}setSync(true);if(ui.tab==="home")render();}catch(e){docRef=null;setSync(false);}})();
})();
</script></body></html>
